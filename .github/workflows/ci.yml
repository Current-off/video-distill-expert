name: CI

# The point of this workflow is narrow: prove that "one command" is true.
# Every job deploys from scratch into a throwaway root, then runs the real
# pipeline. A test that only imports the package would not catch a broken
# installer, and the installer is the product here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        # 3.14 is what a machine bought today installs, and the isolated audit
        # deployed on it while this matrix never did. One OS is enough: an
        # interpreter break shows up before a platform one.
        include:
          - os: ubuntu-latest
            python: "3.14"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Lint
        run: |
          python -m pip install --quiet ruff
          python -m ruff check bootstrap.py demo.py scripts/

      - name: Vendored engine matches MANIFEST.json
        run: python scripts/manifest.py verify

      - name: Deploy into a scratch root
        run: |
          python bootstrap.py \
            --root "$RUNNER_TEMP/vde" \
            --host workbuddy \
            --config "$RUNNER_TEMP/mcp.json" \
            --skill-dir "$RUNNER_TEMP/skills/video-distill-expert" \
            --json

      - name: End-to-end distillation
        run: python demo.py --root "$RUNNER_TEMP/vde"

      - name: Deployment properties
        run: |
          python scripts/selfcheck.py \
            --root "$RUNNER_TEMP/vde" \
            --config "$RUNNER_TEMP/mcp.json" \
            --skill-dir "$RUNNER_TEMP/skills/video-distill-expert"

  generic-host:
    # A host we cannot write a config for must still get a usable snippet, and
    # must not touch the filesystem while producing it.
    name: generic host prints a snippet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Deploy for an unknown host
        run: |
          python bootstrap.py --host generic --root "$RUNNER_TEMP/vde" \
            --no-skill | tee "$RUNNER_TEMP/out.txt"
          grep -q '"video-distill-expert"' "$RUNNER_TEMP/out.txt"
          grep -q '"mcpServers"' "$RUNNER_TEMP/out.txt"
          grep -q "7 tools" "$RUNNER_TEMP/out.txt"

  dry-run:
    # --dry-run is what a cautious user runs first; it must not create anything.
    name: dry run touches nothing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the plan
        run: |
          python bootstrap.py --dry-run --root "$RUNNER_TEMP/vde" \
            --config "$RUNNER_TEMP/mcp.json" | tee "$RUNNER_TEMP/out.txt"
          test ! -e "$RUNNER_TEMP/vde"
          test ! -e "$RUNNER_TEMP/mcp.json"
          grep -q "Dry run only" "$RUNNER_TEMP/out.txt"
