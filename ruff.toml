line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RET", "ARG",
          "ISC", "PYI", "PTH", "RUF"]
ignore = [
    # Chinese notes legitimately use full-width punctuation.
    "RUF001",
    "RUF002",
    "RUF003",
    "PTH105",
    "PYI034",
]
